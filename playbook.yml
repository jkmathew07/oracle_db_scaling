---
# ============================================================================
# oracle_database_scaling
# Entry point. Invoked from Jenkins as:
#   ansible-playbook playbook.yml -i inventory/hosts.ini \
#     -e "target_host=dbhost01 scale_option=scale_up db_sid=ORCL db_home=/u01/app/oracle/product/19.0.0/dbhome_1 \
#         sga_max_size_gb=64 sga_target_gb=64 pga_aggregate_target_gb=16 \
#         pga_aggregate_limit_gb=20 processes=1000 target_server_ram_gb=128" \
#     --vault-password-file=.vaultpass
# NOTE: sessions is NOT passed - it's derived from processes (see
# roles/validations/validate_input) using Oracle's documented formula.
# ============================================================================
- name: Oracle Database Scaling Orchestrator
  hosts: "{{ target_host | default('all') }}"
  become: true
  gather_facts: true
  serial: 1                     # one host at a time - avoids partial-cluster reboots
  max_fail_percentage: 0

  vars_files:
    - group_vars/all.yml
    - group_vars/scaling.yml
    - group_vars/workflows.yml

  roles:
    - orchestrator