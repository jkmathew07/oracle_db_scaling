---
# Lock acquire
- name: Check for existing lock
  ansible.builtin.stat:
    path: "{{ lock_file }}"
  register: lock_stat

- name: Fail if locked and not stale
  ansible.builtin.fail:
    msg: "Another scaling run is active for {{ oracle_sid }} ({{ lock_file }})"
  when:
    - lock_stat.stat.exists
    - (ansible_date_time.epoch | int) - (lock_stat.stat.mtime | int) < lock_timeout_seconds

- name: Create lock dir
  ansible.builtin.file:
    path: "{{ lock_dir }}"
    state: directory
    mode: '0755'

- name: Acquire lock
  ansible.builtin.copy:
    dest: "{{ lock_file }}"
    content: "{{ ansible_date_time.iso8601 }} scale_option={{ scale_option }}"
    mode: '0644'

- block:
    - ansible.builtin.include_role:
        name: validations/validate_input

    - ansible.builtin.include_role:
        name: validations/validate_memory

    # Read-only pre-flight: decides whether this exact request has already
    # been applied (hugepages correct + DB already OPEN with matching
    # params). Sets scale_operation_needed - both blocks below are gated
    # on it, so a repeat run with identical parameters is a safe, cheap
    # no-op instead of a second unnecessary maintenance window.
    - ansible.builtin.include_role:
        name: validations/validate_current_state

    # ================================================================
    # SCALE UP - matches Scale-Up Workflow diagram exactly:
    # Validate Inputs -> Validate Memory -> Check HugePages ->
    # Enough HugePages? -> [Configure/Persist/Reboot if No] ->
    # Validate HugePages -> Start Database (MOUNT) ->
    # Validate Current Parameters -> reconfigure database
    # (pfile+spfile backup before update) -> Shutdown Database ->
    # Startup Database (OPEN - primary only, standby stays MOUNT) ->
    # Post Scale Actions -> Dashboard
    #
    # startup_database is a single consolidated role (target_mode: mount
    # or open) - see roles/workers/startup_database.
    # ================================================================
    - when: scale_option == 'scale_up' and scale_operation_needed
      block:
        - ansible.builtin.include_role:
            name: validations/validate_hugepages

        - ansible.builtin.include_role:
            name: workers/configure_hugepages
          when: not optimal_huge_pages_configured

        - ansible.builtin.include_role:
            name: workers/reboot_server
          when: not optimal_huge_pages_configured and allow_reboot

        - ansible.builtin.include_role:
            name: workers/startup_database
          vars:
            target_mode: mount

        - ansible.builtin.include_role:
            name: validations/validate_db_configuration

        - ansible.builtin.include_role:
            name: workers/reconfigure_database
          when: not db_config_already_optimal

        - ansible.builtin.include_role:
            name: workers/shutdown_database

        - ansible.builtin.include_role:
            name: workers/startup_database
          vars:
            target_mode: open

        - ansible.builtin.include_role:
            name: workers/post_scale_actions

    # ================================================================
    # SCALE DOWN - matches Scale-Down Workflow diagram exactly:
    # Validate Inputs -> Validate Memory -> Check HugePages ->
    # HugePages Over Allocated? -> [Mark for Reconfiguration if Yes] ->
    # Start Database (MOUNT) -> reconfigure database (pfile+spfile
    # backup before update) -> Shutdown Database -> Configure HugePages
    # -> Reboot Server -> Startup Database (OPEN - primary only) ->
    # Validate HugePages Configuration -> Post Scale Actions -> Dashboard
    #
    # NOTE: hugepages check/mark-for-reconfig runs FIRST here, before the
    # database is even touched - opposite position from scale_up, matches
    # the corrected diagram.
    # ================================================================
    - when: scale_option == 'scale_down' and scale_operation_needed
      block:
        - ansible.builtin.include_role:
            name: validations/validate_hugepages

        - ansible.builtin.include_role:
            name: workers/startup_database
          vars:
            target_mode: mount

        - ansible.builtin.include_role:
            name: validations/validate_db_configuration

        - ansible.builtin.include_role:
            name: workers/reconfigure_database
          when: not db_config_already_optimal

        - ansible.builtin.include_role:
            name: workers/shutdown_database

        - ansible.builtin.include_role:
            name: workers/configure_hugepages
          when: not optimal_huge_pages_configured

        - ansible.builtin.include_role:
            name: workers/reboot_server
          when: not optimal_huge_pages_configured and allow_reboot

        - ansible.builtin.include_role:
            name: workers/startup_database
          vars:
            target_mode: open

        - ansible.builtin.include_role:
            name: workers/post_scale_actions

    - ansible.builtin.include_role:
        name: dashboard/update_dashboard

    - ansible.builtin.include_role:
        name: dashboard/write_log
  always:
    - name: Release lock
      ansible.builtin.file:
        path: "{{ lock_file }}"
        state: absent