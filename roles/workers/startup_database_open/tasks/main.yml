---
# "Startup Database (OPEN)" from the workflow diagram. Data Guard aware:
# only a PRIMARY database is opened; a PHYSICAL STANDBY must always remain
# in MOUNT (opening a standby, or worse issuing DDL against one, is wrong).
# A non-Data-Guard standalone database reports database_role=PRIMARY too,
# so this logic is correct and safe for the standalone-only scope of this
# playbook without any extra branching.

- name: "ORA_WRK_OPEN | check current instance status"
  become: true
  become_user: "{{ oracle_user }}"
  environment:
    ORACLE_HOME: "{{ oracle_home }}"
    ORACLE_SID: "{{ oracle_sid }}"
  ansible.builtin.shell: |
    {{ oracle_home }}/bin/sqlplus -s / as sysdba <<EOF
    set heading off feedback off pagesize 0
    select status from v\$instance;
    exit;
    EOF
  register: _owrk_open_status
  changed_when: false
  failed_when: false
  tags: [worker, execute]

- name: "ORA_WRK_OPEN | normalize instance status"
  ansible.builtin.set_fact:
    _owrk_open_status_norm: "{{ _owrk_open_status.stdout | default('') | trim | upper }}"
  tags: [worker, execute]

- name: "ORA_WRK_OPEN | refuse to proceed if instance is not even in MOUNT"
  ansible.builtin.assert:
    that:
      - "'MOUNTED' in _owrk_open_status_norm or 'OPEN' in _owrk_open_status_norm"
    fail_msg: >-
      Instance {{ oracle_sid }} is not in MOUNT/OPEN state (status: '{{
      _owrk_open_status_norm }}'). Cannot determine database_role or open
      it. shutdown_database should not have left it fully down before this
      step - investigate.
    quiet: true
  tags: [worker, execute]

- name: "ORA_WRK_OPEN | check database role (Data Guard awareness)"
  become: true
  become_user: "{{ oracle_user }}"
  environment:
    ORACLE_HOME: "{{ oracle_home }}"
    ORACLE_SID: "{{ oracle_sid }}"
  ansible.builtin.shell: |
    {{ oracle_home }}/bin/sqlplus -s / as sysdba <<EOF
    set heading off feedback off pagesize 0
    select database_role from v\$database;
    exit;
    EOF
  register: _owrk_open_role
  changed_when: false
  when: "'OPEN' not in _owrk_open_status_norm"
  tags: [worker, execute]

- name: "ORA_WRK_OPEN | normalize database role"
  ansible.builtin.set_fact:
    _owrk_open_role_norm: "{{ (_owrk_open_role.stdout | default('PRIMARY')) | trim | upper }}"
  tags: [worker, execute]

- name: "ORA_WRK_OPEN | open database (PRIMARY only, and only if not already OPEN)"
  become: true
  become_user: "{{ oracle_user }}"
  environment:
    ORACLE_HOME: "{{ oracle_home }}"
    ORACLE_SID: "{{ oracle_sid }}"
  ansible.builtin.shell: |
    {{ oracle_home }}/bin/sqlplus -s / as sysdba <<EOF
    alter database open;
    exit;
    EOF
  register: _owrk_open_result
  when:
    - "'OPEN' not in _owrk_open_status_norm"
    - "'PRIMARY' in _owrk_open_role_norm"
  failed_when: "'ORA-' in _owrk_open_result.stdout"
  tags: [worker, execute]

- name: "ORA_WRK_OPEN | record final instance state for handoff"
  ansible.builtin.set_fact:
    final_instance_state: >-
      {{ 'OPEN' if ('OPEN' in _owrk_open_status_norm) or ('PRIMARY' in _owrk_open_role_norm)
         else 'MOUNT (standby - left mounted by design)' }}
  tags: [worker, execute]

# Confirms the running instance's SGA is actually backed by hugepages, not
# silently falling back to regular pages (HugePages_Free dropping below
# HugePages_Total is the signal). Informational only - does not fail the
# play, since this is a sanity confirmation, not a hard gate; the hard
# hugepage guarantees already happened earlier via the GRUB-based
# reservation and post-reboot check in configure_hugepages/reboot_server.
- name: "ORA_WRK_OPEN | verify hugepages are actually in use by the open instance"
  ansible.builtin.shell: "grep -i '^HugePages_Free' /proc/meminfo | awk '{print $2}'"
  register: _owrk_open_hp_free
  changed_when: false
  when: "'PRIMARY' in _owrk_open_role_norm"
  tags: [worker, execute]

- name: "ORA_WRK_OPEN | display database open summary"
  ansible.builtin.debug:
    msg: |
      ╔═══════════════════════════════════════════════════════════════╗
      ║  Oracle Scaling — Database Open Result                         ║
      ╚═══════════════════════════════════════════════════════════════╝
      SID                    : {{ oracle_sid }}
      Status Before Action   : {{ _owrk_open_status_norm }}
      Database Role          : {{ _owrk_open_role_norm | default('n/a - already OPEN') }}
      ────────────────────────────────────────────────────────────────
      {% if 'PRIMARY' in _owrk_open_role_norm %}
      Action Taken           : PRIMARY - opened for read/write
      HugePages Free/Total   : {{ _owrk_open_hp_free.stdout | default('n/a') }} / {{ current_hugepages_total | default('n/a') }}
      HugePages In Use       : {{ (_owrk_open_hp_free.stdout | default('0') | int) < (current_hugepages_total | default(0) | int) }}
      {% else %}
      Action Taken           : STANDBY - left in MOUNT by design (never opened)
      {% endif %}
      Final Instance State   : {{ final_instance_state }}
  tags: [worker, display]
