---
# JIT (just-in-time) verification: startup_database (target_mode: mount)
# already ran earlier in the orchestrator sequence and owns bringing the
# instance up - this role does NOT re-implement startup logic. It only
# confirms, right before touching anything, that the instance is still in
# the state that role left it in. If it isn't, that is surfaced as a
# distinct failure rather than silently retried, because "instance down"
# and "instance won't start because the spfile itself is invalid" (e.g.
# ORA-00823 sga_target > sga_max_size) are different problems - retrying
# startup cannot fix the second one, and blindly doing so here would mask
# it.
- name: "ORA_WRK_RECONFIG | check instance status immediately before any configuration change"
  become: true
  become_user: "{{ oracle_user }}"
  environment:
    ORACLE_HOME: "{{ oracle_home }}"
    ORACLE_SID: "{{ oracle_sid }}"
  ansible.builtin.shell: |
    {{ oracle_home }}/bin/sqlplus -s / as sysdba <<EOF
    set heading off feedback off pagesize 0
    select status from v\$instance;
    exit;
    EOF
  register: _owrk_reconfig_precheck
  changed_when: false
  failed_when: false
  tags: [worker, execute]

- name: "ORA_WRK_RECONFIG | normalize pre-check instance status"
  ansible.builtin.set_fact:
    _owrk_reconfig_status_ok: "{{ ('MOUNTED' in (_owrk_reconfig_precheck.stdout | default('') | upper)) or ('OPEN' in (_owrk_reconfig_precheck.stdout | default('') | upper)) }}"
  tags: [worker, execute]

- name: "ORA_WRK_RECONFIG | refuse to proceed if instance is not confirmed up"
  ansible.builtin.assert:
    that:
      - _owrk_reconfig_status_ok
    fail_msg: >-
      Instance {{ oracle_sid }} is not in MOUNT/OPEN state (status check
      returned: '{{ _owrk_reconfig_precheck.stdout | default('no output') | trim }}').
      Refusing to take a pfile backup or change spfile parameters against an
      instance that is not confirmed up. This role does not attempt to start
      it - that is startup_database's (target_mode: mount) job, earlier in
      this run. If
      that role reported success but the instance is down again now,
      investigate why it went down in between (crash, an external HA/
      monitoring agent, a spfile that is already invalid and refuses to
      start - check the alert log) rather than re-running blindly.
    quiet: true
  tags: [worker, execute]

- name: "ORA_WRK_RECONFIG | display pre-change instance status summary"
  ansible.builtin.debug:
    msg: |
      ╔═══════════════════════════════════════════════════════════════╗
      ║  Oracle Scaling — Pre-Change Instance Status Check              ║
      ╚═══════════════════════════════════════════════════════════════╝
      SID                    : {{ oracle_sid }}
      Status                 : {{ _owrk_reconfig_precheck.stdout | default('(no output)') | trim }}
      Proceeding with changes : YES - instance confirmed up
  tags: [worker, display]


- name: "ORA_WRK_RECONFIG | ensure pfile backup directory exists"
  become: true
  become_user: "{{ oracle_user }}"
  ansible.builtin.file:
    path: "{{ pfile_backup_dir }}"
    state: directory
    mode: '0750'
  tags: [worker, execute]

- name: "ORA_WRK_RECONFIG | set backup timestamp"
  ansible.builtin.set_fact:
    pfile_backup_ts: "{{ ansible_date_time.iso8601_basic_short }}"
  tags: [worker, execute]

- name: "ORA_WRK_RECONFIG | create pfile backup from current spfile"
  become: true
  become_user: "{{ oracle_user }}"
  environment:
    ORACLE_HOME: "{{ oracle_home }}"
    ORACLE_SID: "{{ oracle_sid }}"
  ansible.builtin.shell: |
    {{ oracle_home }}/bin/sqlplus -s / as sysdba <<EOF
    create pfile='{{ pfile_backup_dir }}/init{{ oracle_sid }}_{{ pfile_backup_ts }}.ora' from spfile;
    exit;
    EOF
  register: _owrk_reconfig_pfile
  failed_when: "'ORA-' in _owrk_reconfig_pfile.stdout"
  tags: [worker, execute]

- name: "ORA_WRK_RECONFIG | display pfile backup output"
  ansible.builtin.debug:
    msg: |
      ╔═══════════════════════════════════════════════════════════════╗
      ║  Oracle Scaling — PFILE Backup Result                         ║
      ╚═══════════════════════════════════════════════════════════════╝
      Return code : {{ _owrk_reconfig_pfile.rc }}
      Backup Path : {{ pfile_backup_dir }}/init{{ oracle_sid }}_{{ pfile_backup_ts }}.ora
      ────────────────────────────────────────────────────────────────
      {{ _owrk_reconfig_pfile.stdout | default('(no output)') | truncate(2000) }}
      {% if _owrk_reconfig_pfile.stderr | default('') | length > 0 %}
      STDERR:
      {{ _owrk_reconfig_pfile.stderr | truncate(500) }}
      {% endif %}
  tags: [worker, display]

# Plain OS-level copy of the actual spfile - no RMAN anywhere in this
# playbook, per explicit requirement. This only works for a filesystem-
# located spfile; if it lives in ASM (path starts with '+'), a plain file
# copy cannot read it - fail loudly rather than silently skip the backup,
# since "backup before update" is mandatory here.
- name: "ORA_WRK_RECONFIG | locate the actual spfile path"
  become: true
  become_user: "{{ oracle_user }}"
  environment:
    ORACLE_HOME: "{{ oracle_home }}"
    ORACLE_SID: "{{ oracle_sid }}"
  ansible.builtin.shell: |
    {{ oracle_home }}/bin/sqlplus -s / as sysdba <<EOF
    set heading off feedback off pagesize 0 verify off
    select value from v\$parameter where name='spfile';
    exit;
    EOF
  register: _owrk_reconfig_spfile_path_raw
  changed_when: false
  tags: [worker, execute]

- name: "ORA_WRK_RECONFIG | normalize spfile path"
  ansible.builtin.set_fact:
    _owrk_reconfig_spfile_path: "{{ _owrk_reconfig_spfile_path_raw.stdout | default('') | trim }}"
  tags: [worker, execute]

- name: "ORA_WRK_RECONFIG | refuse to proceed if spfile is in ASM (plain copy cannot read it)"
  ansible.builtin.assert:
    that:
      - not (_owrk_reconfig_spfile_path | trim | first == '+')
    fail_msg: >-
      SPFILE for {{ oracle_sid }} is located in ASM ({{ _owrk_reconfig_spfile_path }}).
      A plain OS file copy cannot read an ASM-managed file, and this
      playbook does not use RMAN or asmcmd. Cannot safely back up the
      spfile - refusing to proceed with any configuration change.
    quiet: true
  when: _owrk_reconfig_spfile_path | length > 0
  tags: [worker, execute]

- name: "ORA_WRK_RECONFIG | ensure spfile backup destination directory exists"
  become: true
  become_user: "{{ oracle_user }}"
  ansible.builtin.file:
    path: "{{ oracle_base }}/admin/pfiles"
    state: directory
    mode: '0750'
  tags: [worker, execute]

- name: "ORA_WRK_RECONFIG | copy spfile to backup location"
  become: true
  become_user: "{{ oracle_user }}"
  ansible.builtin.copy:
    remote_src: true
    src: "{{ _owrk_reconfig_spfile_path }}"
    dest: "{{ oracle_base }}/admin/pfiles/spfile_{{ oracle_sid }}.ora_{{ pfile_backup_ts }}"
    mode: '0640'
  register: _owrk_reconfig_spfile_copy
  tags: [worker, execute]

- name: "ORA_WRK_RECONFIG | verify spfile backup copy exists on disk"
  ansible.builtin.stat:
    path: "{{ oracle_base }}/admin/pfiles/spfile_{{ oracle_sid }}.ora_{{ pfile_backup_ts }}"
  register: _owrk_reconfig_spfile_check
  tags: [worker, execute]

- name: "ORA_WRK_RECONFIG | assert spfile backup copy actually exists"
  ansible.builtin.assert:
    that:
      - _owrk_reconfig_spfile_check.stat.exists
    fail_msg: >-
      Expected spfile backup copy was not found at
      {{ oracle_base }}/admin/pfiles/spfile_{{ oracle_sid }}.ora_{{ pfile_backup_ts }}
      after the copy task reported success - refusing to proceed.
    quiet: true
  tags: [worker, execute]

- name: "ORA_WRK_RECONFIG | display spfile backup output"
  ansible.builtin.debug:
    msg: |
      ╔═══════════════════════════════════════════════════════════════╗
      ║  Oracle Scaling — SPFILE Backup Result (plain file copy)       ║
      ╚═══════════════════════════════════════════════════════════════╝
      Source SPFILE : {{ _owrk_reconfig_spfile_path }}
      Backup Copy   : {{ oracle_base }}/admin/pfiles/spfile_{{ oracle_sid }}.ora_{{ pfile_backup_ts }}
      Copy Applied  : {{ _owrk_reconfig_spfile_copy.changed }}
      Verified      : {{ _owrk_reconfig_spfile_check.stat.exists }}
  tags: [worker, display]

- name: "ORA_WRK_RECONFIG | apply new parameters to spfile"
  become: true
  become_user: "{{ oracle_user }}"
  environment:
    ORACLE_HOME: "{{ oracle_home }}"
    ORACLE_SID: "{{ oracle_sid }}"
  ansible.builtin.shell: |
    {{ oracle_home }}/bin/sqlplus -s / as sysdba <<EOF
    alter system set sga_max_size={{ sga_max_size_gb }}G scope=spfile;
    alter system set sga_target={{ sga_target_gb }}G scope=spfile;
    alter system set pga_aggregate_target={{ pga_aggregate_target_gb }}G scope=spfile;
    alter system set pga_aggregate_limit={{ pga_aggregate_limit_gb }}G scope=spfile;
    alter system set processes={{ processes }} scope=spfile;
    alter system set sessions={{ sessions }} scope=spfile;
    exit;
    EOF
  register: _owrk_reconfig_apply
  failed_when: "'ORA-' in _owrk_reconfig_apply.stdout"
  tags: [worker, execute]

- name: "ORA_WRK_RECONFIG | display spfile parameter change output"
  ansible.builtin.debug:
    msg: |
      ╔═══════════════════════════════════════════════════════════════╗
      ║  Oracle Scaling — SPFILE Parameter Change Result               ║
      ╚═══════════════════════════════════════════════════════════════╝
      Return code : {{ _owrk_reconfig_apply.rc }}
      ────────────────────────────────────────────────────────────────
      SGA_MAX_SIZE          -> {{ sga_max_size_gb }}G
      SGA_TARGET            -> {{ sga_target_gb }}G
      PGA_AGGREGATE_TARGET  -> {{ pga_aggregate_target_gb }}G
      PGA_AGGREGATE_LIMIT   -> {{ pga_aggregate_limit_gb }}G
      PROCESSES             -> {{ processes }}
      SESSIONS              -> {{ sessions }}
      ────────────────────────────────────────────────────────────────
      {{ _owrk_reconfig_apply.stdout | default('(no output)') | truncate(2000) }}
      {% if _owrk_reconfig_apply.stderr | default('') | length > 0 %}
      STDERR:
      {{ _owrk_reconfig_apply.stderr | truncate(500) }}
      {% endif %}
  tags: [worker, display]