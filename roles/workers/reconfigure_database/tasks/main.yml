---
# JIT (just-in-time) verification: startup_database_mount already ran
# earlier in the orchestrator sequence and owns bringing the instance up -
# this role does NOT re-implement startup logic. It only confirms, right
# before touching anything, that the instance is still in the state that
# role left it in. If it isn't, that is surfaced as a distinct failure
# rather than silently retried, because "instance down" and "instance
# won't start because the spfile itself is invalid" (e.g. ORA-00823
# sga_target > sga_max_size) are different problems - retrying startup
# cannot fix the second one, and blindly doing so here would mask it.
- name: "ORA_WRK_RECONFIG | check instance status immediately before any configuration change"
  become: true
  become_user: "{{ oracle_user }}"
  environment:
    ORACLE_HOME: "{{ oracle_home }}"
    ORACLE_SID: "{{ oracle_sid }}"
  ansible.builtin.shell: |
    {{ oracle_home }}/bin/sqlplus -s / as sysdba <<EOF
    set heading off feedback off pagesize 0
    select status from v\$instance;
    exit;
    EOF
  register: _owrk_reconfig_precheck
  changed_when: false
  failed_when: false
  tags: [worker, execute]

- name: "ORA_WRK_RECONFIG | normalize pre-check instance status"
  ansible.builtin.set_fact:
    _owrk_reconfig_status_ok: "{{ ('MOUNTED' in (_owrk_reconfig_precheck.stdout | default('') | upper)) or ('OPEN' in (_owrk_reconfig_precheck.stdout | default('') | upper)) }}"
  tags: [worker, execute]

- name: "ORA_WRK_RECONFIG | refuse to proceed if instance is not confirmed up"
  ansible.builtin.assert:
    that:
      - _owrk_reconfig_status_ok
    fail_msg: >-
      Instance {{ oracle_sid }} is not in MOUNT/OPEN state (status check
      returned: '{{ _owrk_reconfig_precheck.stdout | default('no output') | trim }}').
      Refusing to take a pfile backup or change spfile parameters against an
      instance that is not confirmed up. This role does not attempt to start
      it - that is startup_database_mount's job, earlier in this run. If
      that role reported success but the instance is down again now,
      investigate why it went down in between (crash, an external HA/
      monitoring agent, a spfile that is already invalid and refuses to
      start - check the alert log) rather than re-running blindly.
    quiet: true
  tags: [worker, execute]

- name: "ORA_WRK_RECONFIG | display pre-change instance status summary"
  ansible.builtin.debug:
    msg: |
      ╔═══════════════════════════════════════════════════════════════╗
      ║  Oracle Scaling — Pre-Change Instance Status Check              ║
      ╚═══════════════════════════════════════════════════════════════╝
      SID                    : {{ oracle_sid }}
      Status                 : {{ _owrk_reconfig_precheck.stdout | default('(no output)') | trim }}
      Proceeding with changes : YES - instance confirmed up
  tags: [worker, display]


- name: "ORA_WRK_RECONFIG | ensure pfile backup directory exists"
  become: true
  become_user: "{{ oracle_user }}"
  ansible.builtin.file:
    path: "{{ pfile_backup_dir }}"
    state: directory
    mode: '0750'
  tags: [worker, execute]

- name: "ORA_WRK_RECONFIG | set backup timestamp"
  ansible.builtin.set_fact:
    pfile_backup_ts: "{{ ansible_date_time.iso8601_basic_short }}"
  tags: [worker, execute]

- name: "ORA_WRK_RECONFIG | create pfile backup from current spfile"
  become: true
  become_user: "{{ oracle_user }}"
  environment:
    ORACLE_HOME: "{{ oracle_home }}"
    ORACLE_SID: "{{ oracle_sid }}"
  ansible.builtin.shell: |
    {{ oracle_home }}/bin/sqlplus -s / as sysdba <<EOF
    create pfile='{{ pfile_backup_dir }}/init{{ oracle_sid }}_{{ pfile_backup_ts }}.ora' from spfile;
    exit;
    EOF
  register: _owrk_reconfig_pfile
  failed_when: "'ORA-' in _owrk_reconfig_pfile.stdout"
  tags: [worker, execute]

- name: "ORA_WRK_RECONFIG | display pfile backup output"
  ansible.builtin.debug:
    msg: |
      ╔═══════════════════════════════════════════════════════════════╗
      ║  Oracle Scaling — PFILE Backup Result                         ║
      ╚═══════════════════════════════════════════════════════════════╝
      Return code : {{ _owrk_reconfig_pfile.rc }}
      Backup Path : {{ pfile_backup_dir }}/init{{ oracle_sid }}_{{ pfile_backup_ts }}.ora
      ────────────────────────────────────────────────────────────────
      {{ _owrk_reconfig_pfile.stdout | default('(no output)') | truncate(2000) }}
      {% if _owrk_reconfig_pfile.stderr | default('') | length > 0 %}
      STDERR:
      {{ _owrk_reconfig_pfile.stderr | truncate(500) }}
      {% endif %}
  tags: [worker, display]

# RMAN backup spfile (not a plain file copy) - this works correctly
# regardless of whether the spfile lives on filesystem or in ASM, and is
# the standard, supported way to back up and later restore a binary spfile.
- name: "ORA_WRK_RECONFIG | create spfile backup via RMAN"
  become: true
  become_user: "{{ oracle_user }}"
  environment:
    ORACLE_HOME: "{{ oracle_home }}"
    ORACLE_SID: "{{ oracle_sid }}"
  ansible.builtin.shell: |
    {{ oracle_home }}/bin/rman target / <<EOF
    backup spfile format '{{ pfile_backup_dir }}/spfile{{ oracle_sid }}_{{ pfile_backup_ts }}.bkp';
    exit;
    EOF
  register: _owrk_reconfig_spfile
  failed_when: "'RMAN-' in _owrk_reconfig_spfile.stdout or 'ORA-' in _owrk_reconfig_spfile.stdout"
  tags: [worker, execute]

- name: "ORA_WRK_RECONFIG | display spfile backup output"
  ansible.builtin.debug:
    msg: |
      ╔═══════════════════════════════════════════════════════════════╗
      ║  Oracle Scaling — SPFILE Backup Result (RMAN)                  ║
      ╚═══════════════════════════════════════════════════════════════╝
      Return code : {{ _owrk_reconfig_spfile.rc }}
      Backup Piece: {{ pfile_backup_dir }}/spfile{{ oracle_sid }}_{{ pfile_backup_ts }}.bkp
      Restore with: RMAN> restore spfile from '{{ pfile_backup_dir }}/spfile{{ oracle_sid }}_{{ pfile_backup_ts }}.bkp';
      ────────────────────────────────────────────────────────────────
      {{ _owrk_reconfig_spfile.stdout | default('(no output)') | truncate(2000) }}
      {% if _owrk_reconfig_spfile.stderr | default('') | length > 0 %}
      STDERR:
      {{ _owrk_reconfig_spfile.stderr | truncate(500) }}
      {% endif %}
  tags: [worker, display]

- name: "ORA_WRK_RECONFIG | apply new parameters to spfile"
  become: true
  become_user: "{{ oracle_user }}"
  environment:
    ORACLE_HOME: "{{ oracle_home }}"
    ORACLE_SID: "{{ oracle_sid }}"
  ansible.builtin.shell: |
    {{ oracle_home }}/bin/sqlplus -s / as sysdba <<EOF
    alter system set sga_max_size={{ sga_max_size_gb }}G scope=spfile;
    alter system set sga_target={{ sga_target_gb }}G scope=spfile;
    alter system set pga_aggregate_target={{ pga_aggregate_target_gb }}G scope=spfile;
    alter system set pga_aggregate_limit={{ pga_aggregate_limit_gb }}G scope=spfile;
    alter system set processes={{ processes }} scope=spfile;
    alter system set sessions={{ sessions }} scope=spfile;
    exit;
    EOF
  register: _owrk_reconfig_apply
  failed_when: "'ORA-' in _owrk_reconfig_apply.stdout"
  tags: [worker, execute]

- name: "ORA_WRK_RECONFIG | display spfile parameter change output"
  ansible.builtin.debug:
    msg: |
      ╔═══════════════════════════════════════════════════════════════╗
      ║  Oracle Scaling — SPFILE Parameter Change Result               ║
      ╚═══════════════════════════════════════════════════════════════╝
      Return code : {{ _owrk_reconfig_apply.rc }}
      ────────────────────────────────────────────────────────────────
      SGA_MAX_SIZE          -> {{ sga_max_size_gb }}G
      SGA_TARGET            -> {{ sga_target_gb }}G
      PGA_AGGREGATE_TARGET  -> {{ pga_aggregate_target_gb }}G
      PGA_AGGREGATE_LIMIT   -> {{ pga_aggregate_limit_gb }}G
      PROCESSES             -> {{ processes }}
      SESSIONS              -> {{ sessions }}
      ────────────────────────────────────────────────────────────────
      {{ _owrk_reconfig_apply.stdout | default('(no output)') | truncate(2000) }}
      {% if _owrk_reconfig_apply.stderr | default('') | length > 0 %}
      STDERR:
      {{ _owrk_reconfig_apply.stderr | truncate(500) }}
      {% endif %}
  tags: [worker, display]