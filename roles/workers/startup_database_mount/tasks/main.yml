---

- name: "ORA_WRK_STARTUP | Check OS-level pmon process for this instance"
  ansible.builtin.shell: "ps -ef | grep -i 'ora_pmon_{{ oracle_sid }}' | grep -v grep || true"
  register: _owrk_startup_pmon_check
  changed_when: false
  failed_when: false
  tags:
    - worker
    - execute

- name: "ORA_WRK_STARTUP | Determine if instance process is running at OS level"
  ansible.builtin.set_fact:
    _owrk_startup_pmon_running: "{{ (_owrk_startup_pmon_check.stdout | default('')) | trim | length > 0 }}"
  tags:
    - worker
    - execute

# Only query the instance via sqlplus if the pmon process is actually
# present - otherwise we already know it's down and skip straight to
# startup mount below.
- name: "ORA_WRK_STARTUP | Check current instance status"
  become: true
  become_user: "{{ oracle_user }}"
  environment:
    ORACLE_HOME: "{{ oracle_home }}"
    LD_LIBRARY_PATH: "{{ oracle_home }}/lib"
    ORACLE_SID: "{{ oracle_sid }}"
  ansible.builtin.command:
    argv:
      - "{{ oracle_home }}/bin/sqlplus"
      - "-s"
      - "/"
      - "as"
      - "sysdba"
    stdin: |
      set heading off feedback off pagesize 0 verify off echo off
      select status from v$instance;
      exit;
  register: _owrk_startup_status_raw
  when: _owrk_startup_pmon_running
  changed_when: false
  failed_when: false
  tags:
    - worker
    - execute

- name: "ORA_WRK_STARTUP | Normalize instance status"
  ansible.builtin.set_fact:
    instance_status: >-
      {{ (_owrk_startup_status_raw.stdout | default('')) | trim | upper if _owrk_startup_pmon_running else '' }}
  tags:
    - worker
    - execute

- name: "ORA_WRK_STARTUP | Shutdown immediate if instance is OPEN"
  become: true
  become_user: "{{ oracle_user }}"
  environment:
    ORACLE_HOME: "{{ oracle_home }}"
    LD_LIBRARY_PATH: "{{ oracle_home }}/lib"
    ORACLE_SID: "{{ oracle_sid }}"
  ansible.builtin.command:
    argv:
      - "{{ oracle_home }}/bin/sqlplus"
      - "-s"
      - "/"
      - "as"
      - "sysdba"
    stdin: |
      shutdown immediate;
      exit;
  register: _owrk_startup_shutdown
  when: "'OPEN' in instance_status"
  changed_when: true
  failed_when: "'ORA-' in _owrk_startup_shutdown.stdout"
  tags:
    - worker
    - execute

# Triggers when the pmon check found nothing (instance_status forced to '')
# OR the instance was OPEN and just got shut down above - both cases need
# startup mount.
- name: "ORA_WRK_STARTUP | Startup mount"
  become: true
  become_user: "{{ oracle_user }}"
  environment:
    ORACLE_HOME: "{{ oracle_home }}"
    LD_LIBRARY_PATH: "{{ oracle_home }}/lib"
    ORACLE_SID: "{{ oracle_sid }}"
  ansible.builtin.command:
    argv:
      - "{{ oracle_home }}/bin/sqlplus"
      - "-s"
      - "/"
      - "as"
      - "sysdba"
    stdin: |
      startup mount;
      exit;
  register: _owrk_startup_result
  when: instance_status == '' or 'OPEN' in instance_status
  changed_when: true
  failed_when: "'ORA-' in _owrk_startup_result.stdout"
  tags:
    - worker
    - execute

# Explicit post-mount confirmation - queries fresh rather than trusting the
# startup command's own return code, so a "successful" startup that somehow
# didn't actually reach MOUNT gets caught here rather than assumed.
- name: "ORA_WRK_STARTUP | Verify instance actually reached MOUNT state"
  become: true
  become_user: "{{ oracle_user }}"
  environment:
    ORACLE_HOME: "{{ oracle_home }}"
    LD_LIBRARY_PATH: "{{ oracle_home }}/lib"
    ORACLE_SID: "{{ oracle_sid }}"
  ansible.builtin.command:
    argv:
      - "{{ oracle_home }}/bin/sqlplus"
      - "-s"
      - "/"
      - "as"
      - "sysdba"
    stdin: |
      set heading off feedback off pagesize 0 verify off echo off
      select status from v$instance;
      exit;
  register: _owrk_startup_postcheck
  changed_when: false
  tags:
    - worker
    - execute

- name: "ORA_WRK_STARTUP | Normalize post-mount status"
  ansible.builtin.set_fact:
    _owrk_startup_final_status: "{{ (_owrk_startup_postcheck.stdout | default('')) | trim | upper }}"
  tags:
    - worker
    - execute

- name: "ORA_WRK_STARTUP | Assert instance is properly mounted"
  ansible.builtin.assert:
    that:
      - "'MOUNTED' in _owrk_startup_final_status or 'OPEN' in _owrk_startup_final_status"
    fail_msg: >-
      Instance {{ oracle_sid }} did not reach MOUNT state after startup
      (final status check returned: '{{ _owrk_startup_final_status }}').
      The startup command may have reported success without actually
      mounting - do not proceed to backup/reconfigure steps.
    quiet: true
  tags:
    - worker
    - execute

- name: "ORA_WRK_STARTUP | display startup action output"
  ansible.builtin.debug:
    msg: |
      ╔═══════════════════════════════════════════════════════════════╗
      ║  Oracle Scaling — Instance Startup (MOUNT) Output               ║
      ╚═══════════════════════════════════════════════════════════════╝
      Return code : {{ _owrk_startup_result.rc | default('n/a') }}
      ────────────────────────────────────────────────────────────────
      {{ _owrk_startup_result.stdout | default('(no action - see status below)') | truncate(2000) }}
      {% if _owrk_startup_result.stderr | default('') | length > 0 %}
      STDERR:
      {{ _owrk_startup_result.stderr | truncate(500) }}
      {% endif %}
  tags: [worker, display]

- name: "ORA_WRK_STARTUP | display instance status summary"
  ansible.builtin.debug:
    msg: |
      ╔═══════════════════════════════════════════════════════════════╗
      ║  Oracle Scaling — Instance Status Summary                      ║
      ╚═══════════════════════════════════════════════════════════════╝
      SID                    : {{ oracle_sid }}
      PMON Process Detected  : {{ _owrk_startup_pmon_running }}
      Status Before Action   : {{ instance_status if instance_status | length > 0 else 'DOWN' }}
      Action Taken           : {{ 'SHUTDOWN + STARTUP MOUNT' if 'OPEN' in instance_status else ('STARTUP MOUNT' if instance_status == '' else 'NONE — already MOUNTED') }}
      Final Expected State   : MOUNT

      ✔ DATABASE {{ oracle_sid }} IS PROPERLY MOUNTED — status confirmed: {{ _owrk_startup_final_status }}
  tags: [worker, display]