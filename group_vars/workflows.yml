---
# ============================================================================
# Ordering contract - matches the Scale-Up / Scale-Down Workflow diagrams
# exactly. This var is documentation only (the orchestrator role hardcodes
# the actual sequence); kept here so the sequence is visible without
# reading the orchestrator's Jinja conditionals.
#
# scale_up:   HugePages check runs FIRST (server scales before DB) - the
#             instance must never be asked to hold more SGA than the
#             CURRENT server can back.
#
# scale_down: HugePages check ALSO runs FIRST here (opposite reasoning) -
#             it only marks whether reconfiguration will be needed later;
#             the actual server shrink+reboot happens AFTER the DB has
#             already been scaled down and shut down, while the OLD larger
#             RAM/hugepages are still present. Shrinking the server before
#             the DB would strand a running instance holding a now-too-
#             large SGA.
#
# Both paths open the database at the end (Data Guard aware - only a
# PRIMARY is opened; a PHYSICAL STANDBY always stays in MOUNT), then run
# Post Scale Actions before the dashboard/log steps.
# ============================================================================

workflow_steps:
  scale_up:
    - validate_input
    - validate_memory
    - validate_hugepages
    - configure_hugepages          # conditional - only if not already optimal
    - reboot_server                # conditional - only if hugepages changed
    - startup_database         # target_mode: mount (default)
    - validate_db_configuration
    - reconfigure_database         # conditional - only if not already optimal;
                                    # backs up BOTH pfile and spfile before any change
    - shutdown_database
    - startup_database         # target_mode: open - Data Guard aware,
                                    # PRIMARY only
    - post_scale_actions
    - update_dashboard
    - write_log

  scale_down:
    - validate_input
    - validate_memory
    - validate_hugepages           # runs FIRST here - marks reconfig need only
    - startup_database         # target_mode: mount (default)
    - validate_db_configuration
    - reconfigure_database         # conditional; backs up BOTH pfile and spfile
    - shutdown_database
    - configure_hugepages          # conditional - only if over-allocated vs new SGA
    - reboot_server                # conditional - only if hugepages changed
    - startup_database         # target_mode: open - Data Guard aware,
                                    # verifies hugepages are actually in use
    - post_scale_actions
    - update_dashboard
    - write_log